name: Delivery checks
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  offline:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven
      - run: python -m pip install -r requirements.txt
      - run: python -m unittest discover -s tests -q
      - run: npm ci --ignore-scripts
      - run: npm run docs:build && npm run docs:check
      - run: mvn -B -ntp -f mapped-provider/pom.xml package
      - run: mkdir dist && python scripts/package_sso.py --with-provider --output dist/quick-wecom-transient-sso-v1.0.0.zip
